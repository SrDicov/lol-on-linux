name: debug-void

# Manual, one-distro loop: takes a payload artifact from an existing run, rebuilds
# the Void package from the current packaging script and runs the real smoke test
# inside the Void container. Fixing a Void-only packaging bug this way costs
# minutes instead of a full payload rebuild. Never publishes anything.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id that owns the payload artifact
        required: true
      version:
        description: Package version (YYYY.MM.DD) to stamp
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Build and smoke the Void package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/work" -w /work \
            ghcr.io/void-linux/void-glibc-full \
            sh -c 'xbps-install -Sy bash zstd >/dev/null 2>&1;
                   exec bash -lc "packaging/void/make-xbps.sh --payload out/payload.tar.zst --version $VERSION --out dist &&
                                  ci/smoke-test.sh --format void --package dist/*.xbps"'


name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (YYYY.MM.DD). Empty = today (UTC).'
        required: false
        default: ''
      publish:
        description: 'Create the GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          fi

  # The payload is built from a pinned darling-lol commit; the base runtime and
  # the overlays are compiled on the runner, then packaged. Ubuntu 22.04 keeps
  # the glibc 2.35 / GCC 11 floor fixed no matter what the default runner ships.
  payload:
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/lib/jvm /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af || true
          df -h /

      # Computed by the build script itself: the payload is a pure function of
      # the build recipe (pin, toolchain, build half) and of everything the
      # assembly copies in (runtime/, launcher glue, docs, the version). A
      # packaging, docs or smoke-test edit reuses the payload instead of
      # replaying 25 minutes; a real input change never does.
      - name: Payload cache key
        id: payload-key
        run: echo "key=$(ci/build-payload.sh --payload-key)" >> "$GITHUB_OUTPUT"

      - name: Restore a payload built from the same inputs
        id: payload-cache
        uses: actions/cache/restore@v4
        with:
          path: out
          key: payload-v3-jammy-llvm22-${{ steps.payload-key.outputs.key }}-${{ needs.meta.outputs.version }}

      # The payload cache above is all-or-nothing, so one assembly edit replays
      # the whole build. This second cache holds the compiled base runtime
      # (~2.5 GB compressed) and is keyed only on the build recipe: editing the
      # assembly, runtime/ or packaging/ reuses it and takes the build from ~25
      # minutes to ~2, while a pin, toolchain or build-flag change still
      # recompiles.
      - name: Base runtime cache key
        id: stage-key
        if: steps.payload-cache.outputs.cache-hit != 'true'
        run: echo "key=$(ci/build-payload.sh --stage-key)" >> "$GITHUB_OUTPUT"

      - name: Restore the compiled base runtime
        id: stage-cache
        if: steps.payload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: payload-work/darling-lol/build
          key: base-runtime-v1-jammy-llvm22-${{ steps.stage-key.outputs.key }}

      - name: Build payload
        if: steps.payload-cache.outputs.cache-hit != 'true'
        env:
          LOL_SKIP_BUILD: ${{ steps.stage-cache.outputs.cache-hit }}
        run: |
          mkdir -p out
          ci/ci-build.sh out "${{ needs.meta.outputs.version }}"

      # restore/save instead of the combined action: the combined one writes
      # its entry even when a later step failed, so one broken build (or a
      # half-assembled payload) would be restored as if it were good.
      - name: Save the compiled base runtime
        if: steps.payload-cache.outputs.cache-hit != 'true' && steps.stage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: payload-work/darling-lol/build
          key: ${{ steps.stage-cache.outputs.cache-primary-key }}

      - name: Save the payload
        if: steps.payload-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: out
          key: ${{ steps.payload-cache.outputs.cache-primary-key }}

      - name: Show payload
        run: ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: |
            out/payload.tar.zst
            out/payload.tar.zst.sha256
          if-no-files-found: error

  packages:
    needs: [meta, payload]
    runs-on: ubuntu-latest
    # Each format is built inside its own distro container as root, so the
    # package tools are the real ones (dpkg-deb, rpmbuild, bsdtar, xbps-create)
    # and the files inside the packages end up owned by root:root.
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: debian:12
            script: packaging/deb/make-deb.sh
            # debian:12 has no zstd and the packager unpacks payload.tar.zst.
            pre: 'apt-get update -qq && apt-get install -y -qq --no-install-recommends zstd'
          - format: rpm
            image: fedora:latest
            script: packaging/rpm/make-rpm.sh
            pre: 'dnf install -y rpm-build zstd'
          - format: arch
            image: archlinux:latest
            script: packaging/arch/make-pkg.sh
            pre: 'pacman -Syu --noconfirm && pacman -S --noconfirm --needed libarchive zstd'
          - format: void
            image: ghcr.io/void-linux/void-glibc-full
            script: packaging/void/make-xbps.sh
            pre: 'xbps-install -Sy bash zstd'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: out

      - name: Restore an identical package
        id: pkg-cache
        uses: actions/cache@v4
        with:
          path: dist
          # A package is a pure function of the payload bytes and this format's
          # own packager scripts. Keying on both means a changed payload rebuilds
          # it (the files inside differ) while a smoke-only fix reuses the very
          # same package instead of running dpkg-deb/rpmbuild/bsdtar/xbps again.
          key: pkg-${{ matrix.format }}-v1-${{ hashFiles(format('packaging/{0}/**', matrix.format)) }}-${{ hashFiles('out/payload.tar.zst') }}

      - name: Build ${{ matrix.format }} package
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        env:
          IMG: ${{ matrix.image }}
          PRE: ${{ matrix.pre }}
          SCRIPT: ${{ matrix.script }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/work" -w /work "$IMG" \
            sh -c "$PRE && bash /work/$SCRIPT --payload /work/out/payload.tar.zst --version $VERSION --out /work/dist"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  smoke:
    needs: [meta, packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: debian:12
          - format: rpm
            image: fedora:latest
          - format: arch
            image: archlinux:latest
          - format: void
            image: ghcr.io/void-linux/void-glibc-full
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.format }}
          path: dist

      - name: Smoke test in ${{ matrix.image }}
        env:
          FMT: ${{ matrix.format }}
          IMG: ${{ matrix.image }}
        run: |
          pre=''
          case "$FMT" in
            void) pre='xbps-install -Sy bash >/dev/null;' ;;  # Void images have no bash
            rpm)  pre='dnf install -y util-linux >/dev/null;' ;;  # nor su/runuser
          esac
          # --privileged: Darling mounts an overlayfs at the prefix and ptraces.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            --privileged \
            "$IMG" \
            sh -c "$pre bash -lc \"ci/smoke-test.sh --format $FMT --package /work/dist/*\""

      # Only the release job reads these: a marker exists exactly when this
      # format built and passed, so one broken distro no longer blocks the
      # packages that are ready.
      - name: Mark ${{ matrix.format }} as validated
        run: echo "${{ matrix.format }} passed on ${{ matrix.image }} at $(date -u +%FT%TZ)" > smoke-ok

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-ok-${{ matrix.format }}
          path: smoke-ok
          if-no-files-found: error

  release:
    needs: [meta, payload, packages, smoke]
    # Publishes whatever built and passed, even when another distro did not:
    # waiting for all four turns one broken container into no release at all.
    if: ${{ !cancelled() && inputs.publish && needs.payload.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: pkgs

      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-ok-*
          path: markers
          merge-multiple: true
        # No marker at all means nothing passed; the next step says so in plain
        # words instead of failing inside the download action.
        continue-on-error: true

      - name: Keep only the formats whose smoke test passed
        run: |
          mkdir -p dist
          published=''
          for dir in pkgs/pkg-*; do
            fmt=${dir#pkgs/pkg-}
            if [ -e "markers/$fmt" ]; then
              cp "$dir"/* dist/
              published="$published $fmt"
            else
              echo "release: $fmt built but did not pass its smoke test; not publishing it"
              echo "### $fmt: skipped (smoke test failed)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ -n "$published" ] || { echo "release: nothing passed its smoke test" >&2; exit 1; }
          echo "RELEASE_FORMATS=$published" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Generate manifest and checksums
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          COMMIT=$(python3 -c 'import json;print(json.load(open("upstream.lock"))["commit"])')
          python3 ci/make-manifest.py \
            --dir dist \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --url-base "https://github.com/${{ github.repository }}/releases/download/v$VERSION" \
            --out dist/manifest.json
          ( cd dist && sha256sum ./* > SHA256SUMS )
          cat dist/manifest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          COMMIT=$(python3 -c 'import json;print(json.load(open("upstream.lock"))["commit"])')
          cat > /tmp/notes.md <<EOF
          Prebuilt runtime packages, built from darling-lol @ ${COMMIT:0:12}.
          Formats in this release:${RELEASE_FORMATS}.

          ### Install
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install-remote.sh | bash
          \`\`\`

          Then start **League of Legends (lol-on-linux)** from the menu; the first
          launch downloads Riot's official installer (you need a Riot account and
          ~35 GB of disk).

          ### WARNING
          This project can get your account permanently banned. Do not cheat, do
          not play ranked, do not use your main account. Not affiliated with Riot
          Games. No Riot content is distributed here.
          EOF
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" --title "lol-on-linux $VERSION" --latest \
              --notes-file /tmp/notes.md dist/*
          fi
